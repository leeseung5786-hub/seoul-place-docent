name: Public MCP deployment contract
on:
  pull_request:
    paths: ['deploy/public-mcp/**', 'scripts/build-public-mcp*.mjs', 'scripts/probe-public-mcp.mjs', 'lib/mcp-*.ts', 'app/mcp/**', 'tests/public-mcp*', '.github/workflows/public-mcp.yml']
permissions:
  contents: read
jobs:
  public-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:mcp-public:vercel
      - run: node --experimental-transform-types --import ./tests/ts-resolver.mjs --test tests/public-mcp.test.mjs tests/public-mcp-package.integration.mjs tests/public-mcp-node.integration.mjs tests/mcp-audit-remote.test.mjs tests/mcp-http-audit.test.mjs tests/mcp-protocol.test.mjs tests/place-answer.test.mjs
      - run: pnpm run typecheck
