name: MCP client AI contract
on:
  push:
    branches: [main, 'fix/client-ai-docent-kpi']
  pull_request:
    paths: ['app/mcp/**', 'app/api/admin/mcp-stats/**', 'app/admin/mcp/**', 'app/components/UserAIConnect.tsx', 'lib/mcp-*.ts', 'lib/user-ai.ts', 'lib/place-answer.ts', 'lib/map-address.ts', 'tests/**', '.github/workflows/mcp-client-kpi.yml']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: MCP, evidence, GPS and KPI tests
        run: node scripts/pack-video-records.mjs && node --experimental-transform-types --import ./tests/ts-resolver.mjs --test tests/place-answer.test.mjs tests/mcp-client-contract.test.mjs tests/mcp-protocol.test.mjs tests/mcp-http-audit.test.mjs tests/map-address.test.mjs tests/sites-native-runtime.test.mjs
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
